<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動能篩選器</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00d4aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動能篩選器">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- SF Pro via system fonts — no external CDN needed on macOS/iOS -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Proxima Nova';
  src: url('/fonts/ProximaNova-Light.ttf') format('truetype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Proxima Nova';
  src: url('/fonts/ProximaNova-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Proxima Nova';
  src: url('/fonts/ProximaNova-Semibold.ttf') format('truetype');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
</style>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN TOKENS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg0:       #060b12;
  --bg1:       #0d1421;
  --bg2:       #111c2e;
  --bg3:       #162135;
  --border:    rgba(255,255,255,0.055);
  --accent:    #00d4aa;
  --accent-lo: rgba(0, 212, 170, 0.12);
  --accent-hi: rgba(0, 212, 170, 0.28);
  --text0:     #dde6f0;
  --text1:     #5e7490;
  --text2:     #2a3a50;
  --up:        #22c55e;
  --up-lo:     rgba(34, 197, 94, 0.14);
  --down:      #ef4444;
  --down-lo:   rgba(239, 68, 68, 0.14);
  --hot:       #ef4444;
  --cold:      #22c55e;
  --gold:      #f59e0b;
  --mono:      'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --sans:      'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --tc:        'Proxima Nova', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
  --radius:    5px;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--text0);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   APP SHELL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  height: 50px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}

/* Decorative top accent line */
#header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}


#logo {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.3px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

#logo::before {
  content: '◆';
  font-size: 9px;
  opacity: 0.7;
}

#logo em {
  font-style: normal;
  color: var(--text1);
  font-weight: 400;
  font-size: 12px;
}

/* Separator */
.vsep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* Universe tabs */
#universe-tabs {
  display: flex;
  gap: 3px;
}

.tab {
  padding: 5px 14px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text1);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
}

.tab:hover { color: var(--text0); border-color: var(--border); }

.tab.active {
  background: var(--accent-lo);
  border-color: var(--accent);
  color: var(--accent);
}

.tab:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* Right side controls */
#header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
}

#status-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text1);
}

#status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text2);
  flex-shrink: 0;
  transition: background 0.3s;
}

#status-dot.idle    { background: var(--text2); }
#status-dot.fetching { background: var(--gold); animation: blink 1s step-end infinite; }
#status-dot.done    { background: var(--accent); }
#status-dot.error   { background: var(--up); }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

#refresh-btn {
  padding: 6px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent-lo);
  color: var(--accent);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  transition: background 0.15s;
}

#refresh-btn:hover { background: var(--accent-hi); }
#refresh-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BODY LAYOUT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TABLE PANEL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#table-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  position: relative;
}

/* ── Resizable divider ── */
#divider {
  width: 5px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  position: relative;
  transition: background 0.2s;
  z-index: 10;
}

#divider::after {
  content: '⋮';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--text2);
  font-size: 16px;
  letter-spacing: -2px;
  pointer-events: none;
  transition: color 0.2s;
  user-select: none;
}

#divider:hover,
#divider.dragging {
  background: var(--accent-lo);
}

#divider:hover::after,
#divider.dragging::after {
  color: var(--accent);
}

#table-toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#count-badge {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text1);
  white-space: nowrap;
}

#count-badge b { color: var(--text0); font-size: 13px; }

#filter-box {
  flex: 0 1 180px;
  padding: 5px 10px;
  background: var(--bg0);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text0);
  font-family: var(--mono);
  font-size: 11px;
  outline: none;
  transition: border-color 0.15s;
}

#filter-box::placeholder { color: var(--text2); }
#filter-box:focus { border-color: var(--accent); }

#us-strategy-tabs,
#tw-strategy-tabs {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

.strategy-btn,
.tw-strategy-btn {
  padding: 5px 14px;
  min-width: 72px;
  border-radius: 18px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text1);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}

.strategy-btn:hover,
.tw-strategy-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.strategy-btn.active,
.tw-strategy-btn.active {
  background: var(--accent-lo);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(0, 229, 207, 0.14);
}

.strategy-btn.base {
  border-color: var(--accent);
  color: var(--accent);
}

#updated-label {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
  white-space: nowrap;
}

/* ── Table ── */
#table-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  position: relative;
  min-height: 0;   /* 修復 flex 容器高度計算，確保捲軸可用 */
}

#table-wrap::-webkit-scrollbar { width: 5px; height: 5px; }
#table-wrap::-webkit-scrollbar-track { background: var(--bg0); }
#table-wrap::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
#table-wrap::-webkit-scrollbar-thumb:hover { background: var(--text2); }

#scores-table {
  width: 100%;
  min-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* Sticky header */
#scores-table thead {
  position: sticky;
  top: 0;
  z-index: 5;
}

#scores-table th {
  background: var(--bg1);
  color: var(--text1);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  position: relative;
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.12s;
}

#scores-table th.left { text-align: left; }
#scores-table th.center { text-align: center; }
#scores-table th:hover { color: var(--accent); }
#scores-table th.sort-desc::after { content: ' ↓'; color: var(--accent); }
#scores-table th.sort-asc::after  { content: ' ↑'; color: var(--accent); }

/* ── Sticky (frozen) columns ── */
/* 用 !important 確保 sticky 蓋過 th 的 position:relative */
#scores-table th.col-sticky,
#scores-table td.col-sticky {
  position: sticky !important;
  z-index: 4;
}

#scores-table thead th.col-sticky {
  background: var(--bg1);
  z-index: 5;
}

/* 所有 sticky td 必須使用不透明背景，否則滾動時後方欄位會穿透 */
#scores-table tbody tr td.col-sticky                 { background: #060b12; }
#scores-table tbody tr:nth-child(even) td.col-sticky { background: #0a0f16; }
#scores-table tbody tr:hover td.col-sticky           { background: #111c2e; }
#scores-table tbody tr.selected td.col-sticky        { background: #06191d; }

/* 移除凍結欄位之間的內部 border，消除 1px 透出縫隙 */
#scores-table th.col-sticky:not(.col-sticky-last),
#scores-table td.col-sticky:not(.col-sticky-last) {
  border-right: none;
}

/* 凍結區塊最右側加深色陰影作為視覺分隔 */
#scores-table th.col-sticky-last,
#scores-table td.col-sticky-last {
  border-right: 1px solid rgba(255,255,255,0.08);
  box-shadow: 6px 0 12px rgba(0,0,0,0.6);
}

/* ── 右側凍結欄（SCORE）── */
#scores-table th.col-sticky-right,
#scores-table td.col-sticky-right {
  position: sticky !important;
  right: -8px;
  z-index: 20;
  background-clip: border-box;
  isolation: isolate;
  transform: translateZ(0);
}

/*
  SCORE is sticky on the right. A shadow can paint behind scrolled cells in
  table stacking contexts, so use an opaque same-color left border as a gutter.
*/
#scores-table thead th.col-sticky-right {
  background: var(--bg1);
  z-index: 30;
  border-left: 8px solid #0d1421;
  border-right: 14px solid #0d1421;
  box-shadow: -6px 0 14px rgba(0,0,0,0.6);
}
#scores-table tbody tr td.col-sticky-right {
  background: #060b12;
  border-left: 8px solid #060b12;
  border-right: 14px solid #060b12;
  box-shadow: -4px 0 12px rgba(0,0,0,0.5);
}
#scores-table tbody tr:nth-child(even) td.col-sticky-right {
  background: #0a0f16;
  border-left-color: #0a0f16;
  border-right-color: #0a0f16;
}
#scores-table tbody tr:hover td.col-sticky-right {
  background: #111c2e;
  border-left-color: #111c2e;
  border-right-color: #111c2e;
}
#scores-table tbody tr.selected td.col-sticky-right {
  background: #06191d;
  border-left-color: #06191d;
  border-right-color: #06191d;
}

/* ── Column resize handle ── */
.col-rh {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 2;
  background: transparent;
  transition: background 0.15s;
}
.col-rh:hover { background: rgba(0,212,170,0.45); }

body.col-resizing,
body.col-resizing * { cursor: col-resize !important; user-select: none !important; }

/* flash feedback on dblclick auto-fit */
@keyframes th-flash {
  0%,100% { background: var(--bg1); }
  50%      { background: rgba(0,212,170,0.18); }
}
.th-flash { animation: th-flash 0.3s ease; }

/* Rows */
#scores-table tbody tr {
  border-bottom: 1px solid rgba(255,255,255,0.03);
  cursor: pointer;
  transition: background 0.1s;
}

#scores-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
#scores-table tbody tr:hover { background: var(--bg2) !important; }
#scores-table tbody tr.selected { background: rgba(0,212,170,0.07) !important; }
#scores-table tbody tr.selected td.ticker-cell { color: var(--accent) !important; }

/* Cells */
#scores-table td {
  padding: 7px 10px;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--text0);
  text-align: center;
  vertical-align: middle;
  border-right: 1px solid rgba(255,255,255,0.03);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

td.center { text-align: center; }
td.left   { text-align: left; }

td.rank-cell {
  text-align: center;
  color: var(--text2);
  font-size: 16px;
  font-weight: 500;
}

/* Top-5 rank highlight */
tr[data-rank="1"] td.rank-cell,
tr[data-rank="2"] td.rank-cell,
tr[data-rank="3"] td.rank-cell { color: var(--gold); }

td.ticker-cell {
  color: var(--accent);
  font-weight: 600;
  font-size: 16px;
  text-align: left;
  letter-spacing: 0.2px;
}

td.name-cell {
  font-family: var(--tc);
  font-size: 16px;
  color: var(--text1);
  text-align: left;
  max-width: 90px;
}

/* 合併顯示：代號 + 名稱同行 */
.tc-code {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--accent);
  font-size: 16px;
  margin-right: 4px;
}
.tc-name {
  font-family: var(--tc);
  font-size: 16px;
  color: var(--text0);
}

/* Percentage coloring — US (green=up, red=down) */
#scores-table td.up   { color: var(--up);   }
#scores-table td.down { color: var(--down); }

/* 漲停 / 跌停 badge */
.limit-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 4px;
  border-radius: 3px;
  margin-left: 5px;
  vertical-align: middle;
  letter-spacing: 0.3px;
  line-height: 1.4;
}
.limit-up   { background: var(--up);   color: #fff; }
.limit-down { background: var(--down); color: #fff; }

/* TW coloring — 紅漲綠跌 */
#scores-table td.tw-up   { color: var(--down); }   /* 漲 → 紅 */
#scores-table td.tw-down { color: var(--up);   }   /* 跌 → 綠 */

/* 漲停 / 跌停 — 僅 price、日% 欄位填底色，字白色 */
#scores-table td.limit-up   { background: rgba(127,29,29,0.7) !important; color: #ffffff !important; }
#scores-table td.limit-down { background: rgba(20,83,45,0.7)  !important; color: #ffffff !important; }

/* RSI zone */
#scores-table td.rsi-hot  { color: var(--up);   }
#scores-table td.rsi-cold { color: var(--down); }

/* Score column — heat bar */
td.score-cell {
  position: relative;
  overflow: hidden;
}

td.score-cell.col-sticky-right::before {
  content: '';
  position: absolute;
  inset: 0;
  background: inherit;
  z-index: 0;
  pointer-events: none;
}

.score-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent-lo), rgba(0,212,170,0.22));
  transform-origin: left;
  pointer-events: none;
  z-index: 1;
}

.score-text {
  position: relative;
  z-index: 2;
  font-weight: 600;
  font-size: 16px;
  color: var(--accent);
}

/* BREAKOUT 欄位：橘色熱力條（區別於 SCORE 的青色） */
td.breakout-cell {
  position: relative;
  overflow: hidden;
}
.breakout-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(245,158,11,0.10), rgba(245,158,11,0.25));
  pointer-events: none;
  z-index: 1;
}
.breakout-text {
  position: relative;
  z-index: 2;
  font-weight: 600;
  font-size: 11px;
  color: var(--gold);
}

/* 個股/板塊視角切換 */
#view-toggle {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.view-btn {
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text1);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  transition: all 0.12s;
}
.view-btn:hover { border-color: var(--accent); color: var(--accent); }
.view-btn.active { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }

/* 板塊總覽表 */
#sector-table th {
  background: var(--bg1);
  color: var(--text1);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  text-align: right;
  cursor: pointer;
  user-select: none;
}
#sector-table th.left { text-align: left; }
#sector-table td {
  padding: 9px 10px;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--text0);
  text-align: center;
  vertical-align: middle;
  border-right: 1px solid rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.03);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sector-table td.left { text-align: left; }
#sector-table tbody tr { cursor: pointer; transition: background 0.1s; }
#sector-table tbody tr:hover { background: var(--bg2) !important; }
#sector-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
/* 板塊強弱 */
.sector-strong { color: var(--up) !important; }
.sector-weak   { color: var(--gold) !important; }
/* 展開的子表格 */
.sector-drill tr { cursor: pointer; }
.sector-drill tr:hover td { background: var(--bg2); }
.sector-drill td { padding: 5px 10px; font-size: 11px; }
.sector-drill td.leader { background: rgba(245,158,11,0.08); font-weight: 600; }
.expand-btn { float: right; opacity: 0.5; font-size: 11px; transition: transform 0.2s; }
tr.expanded .expand-btn { transform: rotate(90deg); opacity: 1; }

/* FinTasticRS 新欄位樣式 */
#scores-table td.sector-cell {
  color: var(--text0);
  font-size: 16px;
  text-align: center;
  vertical-align: middle;
}
#scores-table td.sector-rs.strong { color: var(--up);   }   /* 前 30% 強板塊 */
#scores-table td.sector-rs.weak   { color: var(--gold); }   /* 後 30% 弱板塊 */
#scores-table td.rs-rating  { font-weight: 600; color: var(--accent); }
#scores-table td.rs-trend   { font-size: 14px; font-weight: 700; }
#scores-table td.rs-trend.trend-up   { color: var(--down); }   /* ↑ 紅 */
#scores-table td.rs-trend.trend-down { color: var(--up);   }   /* ↓ 綠 */
#scores-table td.ud-ratio   { color: var(--text0); }
#scores-table td.ud-ratio.quality { color: var(--accent); }  /* ≥ 1.4 青色 */

/* Chips columns */
#scores-table td.chips-up   { color: var(--up);   }
#scores-table td.chips-down { color: var(--down); }
#scores-table td.margin-up   { color: var(--down); }  /* margin increase = bearish */
#scores-table td.margin-down { color: var(--up);   }

/* 漲停 / 跌停 row highlight */
#scores-table tbody tr.tw-limit-up   { background: rgba(239,68,68,0.07) !important; }
#scores-table tbody tr.tw-limit-down { background: rgba(34,197,94,0.07) !important; }
#scores-table tbody tr.tw-limit-up   td.col-sticky { background: rgba(20,5,5,1); }
#scores-table tbody tr.tw-limit-down td.col-sticky { background: rgba(5,20,5,1); }

/* 漲停 / 跌停 badge in day% cell */
.limit-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: rgba(239,68,68,0.22);
  color: var(--down);
  border: 1px solid rgba(239,68,68,0.45);
}
.limit-badge.down-badge {
  background: rgba(34,197,94,0.22);
  color: var(--up);
  border-color: rgba(34,197,94,0.45);
}

/* 訊號欄位 badges */
td.signal-cell {
  overflow: visible;
  text-overflow: clip;
}

.sig-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
/* 散戶爆量 — 橘色 */
.sig-retail  { background: rgba(251,146,60,0.18); color: #fb923c; border: 1px solid rgba(251,146,60,0.4); }
/* 主力爆量 — 青色 */
.sig-inst    { background: rgba(0,212,170,0.12); color: var(--accent); border: 1px solid rgba(0,212,170,0.35); }
/* 主力散戶爆量 — 金色 */
.sig-both    { background: rgba(245,158,11,0.18); color: var(--gold); border: 1px solid rgba(245,158,11,0.45); }

/* Empty / initial state */
#empty-msg {
  display: none;
  padding: 80px 24px;
  text-align: center;
  color: var(--text2);
  font-size: 12px;
  letter-spacing: 0.5px;
}
#empty-msg.show { display: block; }

/* Row entrance animation (first 60 rows) */
@keyframes row-in {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: translateY(0); }
}
.row-animate {
  animation: row-in 0.25s ease both;
}

.rank-changed td {
  background-image: linear-gradient(90deg, rgba(0,212,170,0.08), transparent);
}

.rank-new {
  animation: rank-new-in 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes rank-new-in {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CHART PANEL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#chart-panel {
  width: 430px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg0);
  transition: width 0.2s ease;
  position: relative;
}

/* 收起時隱藏圖表，分隔線也跟著隱藏 */
#chart-panel.closed,
#chart-panel.closed + #divider,
#divider + #chart-panel.closed { display: none; }

#close-chart-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 30;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(6, 11, 18, 0.75);
  backdrop-filter: blur(4px);
  color: var(--text1);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.18s, color 0.15s, background 0.15s;
  pointer-events: none;
}
#chart-panel:hover #close-chart-btn {
  opacity: 1;
  pointer-events: auto;
}
#close-chart-btn:hover {
  color: var(--text0);
  background: rgba(239, 68, 68, 0.75);
  border-color: transparent;
}

#chart-topbar {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg1);
  overflow-x: auto;
  overflow-y: hidden;
}

#chart-topbar::-webkit-scrollbar { height: 3px; }
#chart-topbar::-webkit-scrollbar-track { background: transparent; }
#chart-topbar::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

#chart-symbol {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.3px;
  white-space: nowrap;
  flex-shrink: 0;
}
#chart-symbol .sym-name {
  color: var(--text1);
  font-weight: 400;
  font-size: 13px;
  margin-left: 6px;
}

#chart-live-price {
  font-family: var(--mono);
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* 游標 OHLC 資訊列 */
#chart-ohlc {
  display: none;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  flex-shrink: 0;
  white-space: nowrap;
}
#chart-ohlc.active { display: flex; }
#chart-ohlc .ol { color: var(--text1); margin-right: 2px; }
#chart-ohlc .ov { color: var(--text0); font-weight: 500; }
#chart-ohlc .sep { width: 1px; height: 12px; background: var(--border); }
#chart-ohlc .pct { font-weight: 700; }

.chart-ctrl-group {
  margin-left: auto;
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.ctrl {
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text1);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.5px;
  transition: all 0.12s;
}

.ctrl:hover { border-color: var(--accent); color: var(--accent); }
.ctrl.on { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }

/* Divider between period and EMA buttons */
.ctrl-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  align-self: center;
  flex-shrink: 0;
}

/* Chart area */
#chart-area {
  flex: 1;
  position: relative;
  min-height: 0;
}

#chart-mount { width: 100%; height: 100%; }

#chart-mount {
  position: absolute;
  inset: 0;
}

#chart-placeholder {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  pointer-events: none;
  background: rgba(6, 11, 18, 0.6);
}

.ph-icon {
  font-size: 36px;
  opacity: 0.5;
  filter: grayscale(0.3);
}

.ph-text {
  font-size: 12px;
  color: var(--text1);
  letter-spacing: 0.5px;
  text-align: center;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LOADING OVERLAY（列表內，百分比進度條版）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(6, 11, 18, 0.88);
  backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}

#overlay.show { display: flex; }

#overlay-pct {
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -1px;
  line-height: 1;
}

.progress-track {
  width: 240px;
  height: 3px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}

#overlay-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text1);
  letter-spacing: 0.8px;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ERROR TOAST
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#toast {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 18px;
  background: #1a0f0f;
  border: 1px solid var(--up);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--up);
  z-index: 1000;
  animation: toast-in 0.2s ease;
}

#toast.show { display: block; }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>

<script>
// ══════════════════════════════════════════════════════════════
//  COLUMN DEFINITIONS
// ══════════════════════════════════════════════════════════════
// 板塊英文 → 繁體中文（對應 server.py SECTOR_ZH）
const SECTOR_ZH_MAP = {
  "Technology":             "科技",
  "Financial Services":     "金融服務",
  "Healthcare":             "醫療保健",
  "Consumer Cyclical":      "非必需消費",
  "Consumer Defensive":     "必需消費",
  "Energy":                 "能源",
  "Industrials":            "工業",
  "Basic Materials":        "基本材料",
  "Real Estate":            "房地產",
  "Utilities":              "公用事業",
  "Communication Services": "通訊服務",
};
function sectorZh(name) { return SECTOR_ZH_MAP[name] || name; }

const US_COLS = [
  { key:'rank',           label:'RANK',        w:'52px',  align:'center', cls:'rank-cell',    fmt:v=>v??'—', sticky:true },
  { key:'sector_zh',      label:'板塊',         w:'80px',  align:'center', cls:'sector-cell',  fmt:v=>v||'—', sticky:true },
  { key:'ticker',         label:'TICKER',      w:'78px',  align:'left',   cls:'ticker-cell',  fmt:v=>v||'—', sticky:true },
  { key:'price',          label:'PRICE',       w:'80px',  align:'right',  fmt:v=>v!=null?`${Number.isInteger(v)?v:v.toFixed(2)}`:'—' },
  { key:'day_return',     label:'當日%',       w:'68px',  align:'right',  cls:'pct',          fmt:pct },

const STATIC_BASE = IS_STATIC
  ? window.location.href.replace(/\/[^/]*$/, '') + '/data'
  : '';

/** 根據當前 universe 取對應靜態 JSON，並更新 S.scores */
async function loadStaticScores() {
  const isTw = S.universe === 'tw';
  const file  = isTw
    ? (S.twStrategy === 'rs' ? 'tw_rs_scores.json' : 'tw_scores.json')
    : 'us_scores.json';
  const r = await fetch(`${STATIC_BASE}/${file}`);
  const d = await r.json();
  S.scores = d.scores || [];
}

async function bootstrapStaticData() {
  lockUI(true);
  showOverlay('載入靜態資料…', 30);
  try {
    await loadStaticScores();
    showOverlay('完成', 100);
    applyFilter(); renderHead(); renderBody();
    updateStrategyTabs();
    setStatus('done', '靜態資料（每日更新）');
    document.getElementById('updated-label').textContent = '靜態資料（每日更新）';
  } catch(e) {
    console.warn('Static data load failed', e);
    setStatus('error', '資料載入失敗');
  }
  hideOverlay(); lockUI(false);
}

function cols() {
  if (S.universe === 'tw') {
    return S.twStrategy === 'chips' ? TW_COLS : TW_RS_COLS;
  }
  return S.strategyMode === 'rs' ? US_RS_COLS : US_COLS;
}
function scoreKey() {
  if (S.universe === 'tw') return S.twStrategy === 'chips' ? 'tw_score' : 'rs_score';
  if (S.strategyLayers.fundamental) return 'adjusted_score';
  if (S.strategyLayers.technical) return 'momentum_score';
  return 'rs_rating';
}

function strategyFilteredRows(rows) {
  if (S.universe === 'tw' || _currentView !== 'stock') return rows;
  if (S.strategyLayers.technical || S.strategyLayers.fundamental) {
    return rows.filter(r => r.pass_technical === true);
  }
  return rows;
}

function applyFilter() {
  const q = document.getElementById('filter-box').value.trim().toLowerCase();
  S.filteredScores = q
    ? S.scores.filter(r =>
        (r.ticker||'').toLowerCase().includes(q) ||
        (r.name||'').toLowerCase().includes(q))
    : S.scores;
}

function sortedData() {
  let data = strategyFilteredRows([...S.filteredScores]);
  const key = S.sortKey || scoreKey();
  if (key) {
    data.sort((a, b) => {
      let av = a[key] ?? -Infinity;
      let bv = b[key] ?? -Infinity;
      if (typeof av === 'string') return S.sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      return S.sortAsc ? av - bv : bv - av;
    });
  }
  if (_currentView === 'stock' && !S.sortKey) data = data.slice(0, 100);
  return data;
}

// Saved column widths per universe key (persists across sort re-renders)
const _colW = {};
let   _stickyMap = {};   // colIdx → left px (updated each renderHead call)

function renderHead() {
  const thead = document.getElementById('t-head');
  const uKey  = S.universe;
  const tr    = document.createElement('tr');
  const tableCols = cols();
  const colWidth = (col, idx) => {
    const defaultW = parseInt(col.w) || 0;
    const minW = col.minW || defaultW || 36;
    const saved = _colW[uKey]?.[idx];
    return Math.max(minW, saved || defaultW);
  };
  const tableMinWidth = tableCols.reduce((sum, col, idx) => sum + colWidth(col, idx), 0);
  const table = document.getElementById('scores-table');
  if (table) table.style.minWidth = `${tableMinWidth}px`;

  // Pre-compute sticky left offsets synchronously from saved/default widths
  _stickyMap = {};
  let stickyAcc = 0;
  let lastStickyIdx = -1;
  tableCols.forEach((col, idx) => {
    if (!col.sticky) return;
    _stickyMap[idx] = stickyAcc;
    stickyAcc += colWidth(col, idx);
    lastStickyIdx = idx;
  });

  tableCols.forEach((col, idx) => {
    const th = document.createElement('th');
    th.dataset.colIdx = idx;
    th.dataset.colKey = col.key;

    // Restore saved width or use default
    th.style.width = `${colWidth(col, idx)}px`;

    // th 永遠置中，不繼承欄位的 align 設定
    if (col.sticky) {
      th.classList.add('col-sticky');
      th.style.left = _stickyMap[idx] + 'px';
      if (idx === lastStickyIdx) th.classList.add('col-sticky-last');
    }
    if (col.sticky_right) {
      th.classList.add('col-sticky-right');
      th.style.right = '-8px';
    }

    // Sort label (text only – handle click fires after resize check)
    const label = document.createTextNode(col.label);
    th.appendChild(label);

    if (S.sortKey === col.key)
      th.classList.add(S.sortAsc ? 'sort-asc' : 'sort-desc');

    // Sort click (skip when clicking the resize handle)
    th.addEventListener('click', (e) => {
      if (e.target.classList.contains('col-rh')) return;
      if (col.key === 'rank') {
        // 點 RANK 恢復預設動能分數排序
        S.sortKey = scoreKey();
        S.sortAsc = false;
      } else if (S.sortKey === col.key) {
        S.sortAsc = !S.sortAsc;
      } else {
        S.sortKey = col.key;
        S.sortAsc = false;
      }
      renderHead(); renderBody();
    });

    // Resize handle
    const rh = document.createElement('div');
    rh.className = 'col-rh';

    // ── Drag to resize ──
    rh.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const startX   = e.clientX;
      const startW   = th.offsetWidth;
      document.body.classList.add('col-resizing');

      const onMove = (e) => {
        const w = Math.max(col.minW || 36, startW + e.clientX - startX);
        th.style.width = w + 'px';
        if (!_colW[uKey]) _colW[uKey] = {};
        _colW[uKey][idx] = w;
        table.style.minWidth = `${tableCols.reduce((sum, c, i) => sum + (i === idx ? w : colWidth(c, i)), 0)}px`;
        if (col.sticky) updateStickyLefts();
      };
      const onUp = () => {
        document.body.classList.remove('col-resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    // ── Double-click to auto-fit ──
    rh.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const colIdx = parseInt(th.dataset.colIdx);

      // Measure th label width
      let max = th.scrollWidth;

      // Measure all td cells in this column
      document.querySelectorAll('#t-body tr').forEach(row => {
        const td = row.querySelectorAll('td')[colIdx];
        if (!td) return;
        // For score cells, measure the inner span
        const inner = td.querySelector('.score-text');
        max = Math.max(max, inner ? inner.scrollWidth + 20 : td.scrollWidth);
      });

      const w = Math.max(col.minW || 36, max + 18);  // content + padding
      th.style.width = w + 'px';
      if (!_colW[uKey]) _colW[uKey] = {};
      _colW[uKey][idx] = w;
      table.style.minWidth = `${tableCols.reduce((sum, c, i) => sum + (i === idx ? w : colWidth(c, i)), 0)}px`;

      // Flash feedback
      th.classList.add('th-flash');
      th.addEventListener('animationend', () => th.classList.remove('th-flash'), { once: true });
    });

    th.appendChild(rh);
    tr.appendChild(th);
  });
  thead.innerHTML = '';
  thead.appendChild(tr);
}

function renderBody(opts = {}) {
  const animate = opts.animate === true;
  applyFilter();
  const data = sortedData();
  const maxScore = Math.max(...data.map(r => r[scoreKey()] ?? 0), 0.001);
  const theCols = cols();
  const tbody = document.getElementById('t-body');
  const oldRects = new Map();
  if (animate) {
    document.querySelectorAll('#t-body tr').forEach(tr => {
      if (tr.dataset.ticker) oldRects.set(tr.dataset.ticker, tr.getBoundingClientRect());
    });
  }
  const frag = document.createDocumentFragment();

  data.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.dataset.ticker = row.ticker;
    tr.dataset.rank = i + 1;
    if (S.selectedTicker === row.ticker) tr.classList.add('selected');
    if (!animate && i < 60) { tr.classList.add('row-animate'); tr.style.animationDelay = `${i * 12}ms`; }
    if (animate && !oldRects.has(row.ticker) && i < 80) tr.classList.add('rank-new');
    if (S.universe === 'tw') {
      if (row.is_limit_up)   tr.classList.add('tw-limit-up');
      else if (row.is_limit_down) tr.classList.add('tw-limit-down');
    }
    tr.addEventListener('click', () => pickTicker(row.ticker));

    // 漲停 / 跌停：只使用 tw-stock-agent 後端傳回的交易所依據，不用漲跌幅估算。
    const _limitUp   = S.universe === 'tw' && row.is_limit_up === true;
    const _limitDown = S.universe === 'tw' && row.is_limit_down === true;

    theCols.forEach((col, idx) => {
      const td = document.createElement('td');
      const val = (col.key === 'rank' && S.universe !== 'tw' && S.strategyMode !== 'rs')
        ? i + 1
        : row[col.key];
      const display = col.fmt ? col.fmt(val, i) : '';

      if (col.key === '_signal' && S.universe === 'tw') {
        // 訊號判斷：量比 ≥ 1.5 為爆量；fi_net > 0 為主力入場
        const highVol  = (row.amount_ratio || 0) >= 1.5;
        const instIn   = (row.fi_net || 0) > 0;
        let sigClass = '', sigText = '';
        if (highVol && instIn)  { sigClass = 'sig-both';   sigText = '主力散戶爆量'; }
        else if (instIn)        { sigClass = 'sig-inst';   sigText = '主力爆量'; }
        else if (highVol)       { sigClass = 'sig-retail'; sigText = '散戶爆量'; }
        td.innerHTML = sigText ? `<span class="sig-badge ${sigClass}">${sigText}</span>` : '';
      } else if (col.cls === 'score') {
        const pctFill = maxScore > 0 ? Math.min(100, (val / maxScore) * 100) : 0;
        td.classList.add('score-cell');
        td.innerHTML = `<div class="score-fill" style="width:${pctFill}%"></div><span class="score-text">${display}</span>`;
      } else if (col.cls === 'breakout') {
        const pctFill = val != null ? Math.min(100, val) : 0;
        td.classList.add('breakout-cell');
        td.innerHTML = `<div class="breakout-fill" style="width:${pctFill}%"></div><span class="breakout-text">${display}</span>`;
      } else if (col.tw_merge_name && S.universe === 'tw') {
        // 合併顯示：去掉 .TW/.TWO 後綴，代號+名稱同行
        const code = (row.ticker||'').replace(/\.(TW|TWO)$/, '');
        td.innerHTML = `<span class="tc-code">${code}</span><span class="tc-name">${row.name||''}</span>`;
      } else {
        td.textContent = display;
      }

      if (col.cls) td.classList.add(col.cls);

      // Percentage coloring（TW：紅漲綠跌；US：綠漲紅跌）
      if (col.cls === 'pct' && val != null) {
        const upCls   = S.universe === 'tw' ? 'tw-up'   : 'up';
        const downCls = S.universe === 'tw' ? 'tw-down' : 'down';
        if (val > 0) td.classList.add(upCls);
        else if (val < 0) td.classList.add(downCls);

      }

      // Price column: color based on day_return direction
      if (col.key === 'price' && row.day_return != null) {
        const upCls   = S.universe === 'tw' ? 'tw-up'   : 'up';
        const downCls = S.universe === 'tw' ? 'tw-down' : 'down';
        if (row.day_return > 0)      td.classList.add(upCls);
        else if (row.day_return < 0) td.classList.add(downCls);
      }

      // 漲停 / 跌停底色：只套在 price 和 day_return 欄位
      if (_limitUp   && (col.key === 'price' || col.key === 'day_return')) td.classList.add('limit-up');
      if (_limitDown && (col.key === 'price' || col.key === 'day_return')) td.classList.add('limit-down');

      // FinTasticRS 新欄位著色
      if (col.key === 'sector_rs' && val != null) {
        const mult = row.sector_multiplier;
        if (mult >= 1.10) td.classList.add('strong');
        else if (mult <= 0.90) td.classList.add('weak');
      }
      if (col.key === 'rs_trend' && val) {
        if (val === '↑') td.classList.add('trend-up');
        else if (val === '↓') td.classList.add('trend-down');
      }
      if (col.key === 'ud_ratio_60d' && val != null && val >= 1.4) {
        td.classList.add('quality');
      }

      // 台股融資增減：正值=紅（漲色），負值=綠（跌色）
      if (S.universe === 'tw' && col.key === 'margin_chg' && val != null) {
        if (val > 0) td.classList.add('tw-up');
        else if (val < 0) td.classList.add('tw-down');
      }

      // Chips / Margin coloring — US only，TW 不套用文字顏色
      if (S.universe !== 'tw') {
        if (col.cls === 'chips' && val != null) {
          if (val > 0) td.classList.add('chips-up');
          else if (val < 0) td.classList.add('chips-down');
        }
        if (col.cls === 'margin' && val != null) {
          if (val > 0) td.classList.add('margin-up');
          else if (val < 0) td.classList.add('margin-down');
        }
      }

      // RSI 超買超賣上色：>70 紅（超買警示）；<30 綠（超賣機會）
      if (col.key === 'rsi' && val != null) {
        if (val > 70) td.classList.add('tw-up');        // 紅
        else if (val < 30) td.classList.add('tw-down'); // 綠
      }

      if (col.align === 'left')   td.classList.add('left');
      if (col.align === 'center') td.classList.add('center');
      if (col.sticky) {
        td.classList.add('col-sticky');
        td.style.left = (_stickyMap[idx] ?? 0) + 'px';
        const lastIdx = Math.max(...Object.keys(_stickyMap).map(Number));
        if (idx === lastIdx) td.classList.add('col-sticky-last');
      }
      if (col.sticky_right) {
        td.classList.add('col-sticky-right');
        td.style.right = '-8px';
      }

      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });

  tbody.innerHTML = '';
  tbody.appendChild(frag);

  if (animate && oldRects.size) {
    requestAnimationFrame(() => {
      const moved = [];
      tbody.querySelectorAll('tr').forEach(tr => {
        const oldRect = oldRects.get(tr.dataset.ticker);
        if (!oldRect) return;
        const newRect = tr.getBoundingClientRect();
        const dy = oldRect.top - newRect.top;
        if (Math.abs(dy) < 1) return;
        tr.style.transition = 'none';
        tr.style.transform = `translateY(${dy}px)`;
        moved.push(tr);
      });

      requestAnimationFrame(() => {
        moved.forEach(tr => {
          tr.classList.add('rank-changed');
          tr.style.transition = 'transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1), background 520ms ease';
          tr.style.transform = 'translateY(0)';
        });
        setTimeout(() => {
          moved.forEach(tr => {
            tr.style.transition = '';
            tr.style.transform = '';
            tr.classList.remove('rank-changed');
          });
        }, 620);
      });
    });
  }

  document.getElementById('count-num').textContent = data.length;
  const empty = document.getElementById('empty-msg');
  empty.classList.toggle('show', data.length === 0 && S.scores.length === 0);
}

function initChart() {
  const mount = document.getElementById('chart-mount');
  const area  = document.getElementById('chart-area');

  if (typeof LightweightCharts === 'undefined') {
    document.querySelector('.ph-text').textContent = '圖表庫未載入（請確認網路連線）';
    return;
  }

  lwChart = LightweightCharts.createChart(mount, {
    width:  mount.clientWidth,
    height: mount.clientHeight,
    layout: {
      background:  { color: '#060b12' },
      textColor:   '#5e7490',
    },
    grid: {
      vertLines: { color: 'rgba(255,255,255,0.025)' },
      horzLines: { color: 'rgba(255,255,255,0.025)' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: 'rgba(0,212,170,0.35)', labelBackgroundColor: '#0d1421' },
      horzLine: { color: 'rgba(0,212,170,0.35)', labelBackgroundColor: '#0d1421' },
    },
    timeScale:  { borderColor: 'rgba(255,255,255,0.05)', timeVisible: true },
    rightPriceScale: { borderColor: 'rgba(255,255,255,0.05)' },
  });

  candleSeries = lwChart.addCandlestickSeries({
    upColor:        '#22c55e',
    downColor:      '#ef4444',
    borderUpColor:  '#22c55e',
    borderDownColor:'#ef4444',
    wickUpColor:    '#22c55e',
    wickDownColor:  '#ef4444',
  });

  // Shrink main price scale to leave room for volume at bottom
  lwChart.priceScale('right').applyOptions({
    scaleMargins: { top: 0.04, bottom: 0.22 },
  });

  // Volume histogram on its own scale
  volSeries = lwChart.addHistogramSeries({
    priceFormat:      { type: 'volume' },
    priceScaleId:     'vol',
    lastValueVisible: false,
    priceLineVisible: false,
  });
  lwChart.priceScale('vol').applyOptions({
    scaleMargins: { top: 0.8, bottom: 0 },
  });

  // Resize
  const ro = new ResizeObserver(() => {
    lwChart.applyOptions({ width: mount.clientWidth, height: mount.clientHeight });
  });
  ro.observe(area);

  // ── 游標 OHLC 顯示 ────────────────────────────────────────────────
  lwChart.subscribeCrosshairMove(param => {
    const ohlcEl = document.getElementById('chart-ohlc');
    const liveEl = document.getElementById('chart-live-price');

    // 游標離開或無資料 → 恢復即時價格
    if (!param.time || !param.seriesData || !candleSeries) {
      ohlcEl.className = '';
      liveEl.style.opacity = '1';
      return;
    }

    const bar = param.seriesData.get(candleSeries);
    if (!bar) {
      ohlcEl.className = '';
      liveEl.style.opacity = '1';
      return;
    }

    const { open, high, low, close } = bar;
    const visibleRaw = S.period === 'W' ? toWeekly(ohlcvToCandles(S.ohlcvData)) : ohlcvToCandles(S.ohlcvData);
    const idx = visibleRaw.findIndex(c => c.time === bar.time);
    const prevClose = idx > 0 ? visibleRaw[idx - 1].close : open;
    const isLatest = idx === visibleRaw.length - 1;
    const scoreRow = S.scores.find(r => r.ticker === S.selectedTicker);
    const pctValue = isLatest && scoreRow?.day_return != null
      ? scoreRow.day_return * 100
      : ((close - prevClose) / prevClose * 100);
    const isUp   = pctValue >= 0;
    // TW：紅漲綠跌；US：綠漲紅跌
    const pctColor = S.universe === 'tw'
      ? (isUp ? 'var(--down)' : 'var(--up)')
      : (isUp ? 'var(--up)'  : 'var(--down)');
    const arrow  = isUp ? '▲' : '▼';
    const sign   = isUp ? '+' : '';

    const fmt = v => v.toFixed(2);
    ohlcEl.innerHTML = `
      <span><span class="ol">開</span><span class="ov">${fmt(open)}</span></span>
      <span class="sep"></span>
      <span><span class="ol">高</span><span class="ov">${fmt(high)}</span></span>
      <span class="sep"></span>
      <span><span class="ol">低</span><span class="ov">${fmt(low)}</span></span>
      <span class="sep"></span>
      <span><span class="ol">收</span><span class="ov">${fmt(close)}</span></span>
      <span class="sep"></span>
      <span class="pct" style="color:${pctColor}">${arrow} ${sign}${pctValue.toFixed(2)}%</span>
    `;
    ohlcEl.className = 'active';
    liveEl.style.opacity = '0';   // 游標期間隱藏即時價格，避免重疊
  });
}

function ohlcvToCandles(data) {
  if (!data || !Array.isArray(data.dates)) return [];
  return data.dates.map((d, i) => ({
    time:  d,
    open:  data.open[i],
    high:  data.high[i],
    low:   data.low[i],
    close: data.close[i],
    _vol:  data.volume?.[i] ?? 0,
  })).filter(c => c.open && c.close);
}

function toWeekly(candles) {
  const wk = {};
  candles.forEach(c => {
    const dt  = new Date(c.time);
    const dow = dt.getUTCDay();
    const mon = new Date(dt);
    mon.setUTCDate(dt.getUTCDate() - (dow === 0 ? 6 : dow - 1));
    const key = mon.toISOString().slice(0, 10);
    if (!wk[key]) wk[key] = { time: key, open: c.open, high: c.high, low: c.low, close: c.close, _vol: 0 };
    else {
      wk[key].high  = Math.max(wk[key].high, c.high);
      wk[key].low   = Math.min(wk[key].low,  c.low);
      wk[key].close = c.close;
    }
    wk[key]._vol += c._vol;
  });
  return Object.values(wk).sort((a, b) => a.time.localeCompare(b.time));
}

function calcEMA(candles, span) {
  const k = 2 / (span + 1);
  let e = candles[0]?.close ?? 0;
  return candles.map((c, i) => {
    e = i === 0 ? c.close : c.close * k + e * (1 - k);
    return { time: c.time, value: e };
  });
}

const EMA_COLORS = { 20: '#f59e0b', 50: '#38bdf8', 120: '#c084fc', 200: '#ffffff' };

function renderChart() {
  if (!S.ohlcvData) return;
  const raw     = ohlcvToCandles(S.ohlcvData);
  const candles = S.period === 'W' ? toWeekly(raw) : raw;
  const scoreRow = S.scores.find(r => r.ticker === S.selectedTicker);

  // K棒顏色：台股紅漲綠跌，美股綠漲紅跌
  // 顏色基準：close vs 昨收（prev_close），非 close vs open
  const isTw      = S.universe === 'tw';
  const upColor   = isTw ? '#ef4444' : '#22c55e';
  const downColor = isTw ? '#22c55e' : '#ef4444';

  // 設定 series 預設（applyOptions 處理無昨收時的 fallback）
  candleSeries.applyOptions({
    upColor,   downColor,
    borderUpColor: upColor,   borderDownColor: downColor,
    wickUpColor:   upColor,   wickDownColor:   downColor,
  });

  // 逐根設定顏色（用昨收判斷漲跌，才能正確處理跳空）
  candles.forEach((c, i) => {
    const prevClose = i > 0 ? candles[i - 1].close : c.open;
    const col = c.close >= prevClose ? upColor : downColor;
    c.color       = col;
    c.borderColor = col;
    c.wickColor   = col;
  });

  candleSeries.setData(candles);

  // Volume histogram（顏色同步，同樣用昨收判斷）
  if (volSeries) {
    volSeries.setData(candles.map((c, i) => {
      const prevClose = i > 0 ? candles[i - 1].close : c.open;
      const isUp = c.close >= prevClose;
      return {
        time:  c.time,
        value: c._vol,
        color: isUp
          ? (isTw ? 'rgba(239,68,68,0.55)' : 'rgba(34,197,94,0.55)')
          : (isTw ? 'rgba(34,197,94,0.55)' : 'rgba(239,68,68,0.55)'),
      };
    }));
  }

  // Remove old EMA series
  Object.values(emaSeries).forEach(s => lwChart.removeSeries(s));
  emaSeries = {};

  // Add active EMA series
  Object.entries(S.ema).forEach(([span, on]) => {
    if (!on) return;
    const n = parseInt(span);
    if (candles.length < n) return;
    const s = lwChart.addLineSeries({
      color:              EMA_COLORS[n] || '#aaa',
      lineWidth:          1.5,
      priceLineVisible:   false,
      lastValueVisible:   true,
      crosshairMarkerVisible: false,
    });
    s.setData(calcEMA(candles, n));
    emaSeries[span] = s;
  });

  lwChart.timeScale().fitContent();

  // Live price display: prefer exchange quote row so it matches the ranked table.
  const last     = candles[candles.length - 1];
  const prevClose = candles.length >= 2 ? candles[candles.length - 2].close : last.open;
  if (last) {
    const quotePrice = scoreRow?.price ?? last.close;
    const quoteReturn = scoreRow?.day_return;
    const chg    = quoteReturn != null ? quoteReturn : ((quotePrice - prevClose) / prevClose);
    const chgPct = (chg * 100).toFixed(2);
    const isTw   = S.universe === 'tw';
    const col    = chg >= 0
      ? (isTw ? 'var(--down)' : 'var(--up)')    // TW 漲=紅, US 漲=綠
      : (isTw ? 'var(--up)'   : 'var(--down)'); // TW 跌=綠, US 跌=紅
    const sign   = chg >= 0 ? '+' : '';
    document.getElementById('chart-live-price').innerHTML =
      `<span style="color:${col};font-family:var(--mono);font-size:12px;">${quotePrice.toFixed(2)} (${sign}${chgPct}%)</span>`;
  }
}

async function pickTicker(ticker, period) {
  if (!ticker) return;
  const hp = period ?? S.historyPeriod;
  S.selectedTicker = ticker;

  // 自動展開圖表（如果是關閉狀態）
  const chartPanel = document.getElementById('chart-panel');
  const divider    = document.getElementById('divider');
  if (chartPanel.classList.contains('closed')) {
    chartPanel.classList.remove('closed');
    if (divider) divider.style.display = '';
  }

  document.querySelectorAll('#t-body tr').forEach(tr => {
    tr.classList.toggle('selected', tr.dataset.ticker === ticker);
  });
  // 顯示「代號 · 名稱」
  const _scoreRow = S.scores.find(r => r.ticker === ticker);
  const _code = ticker.replace(/\.(TW|TWO)$/, '');
  const _name = _scoreRow ? (_scoreRow.name || _scoreRow.stock_name || '') : '';
  document.getElementById('chart-symbol').innerHTML = _name
    ? `${_code}<span class="sym-name">${_name}</span>`
    : _code;
  document.getElementById('chart-live-price').textContent = '';
  document.getElementById('chart-ohlc').className = '';

  const ph = document.getElementById('chart-placeholder');
  ph.style.display = 'flex';
  document.querySelector('.ph-text').textContent = '載入中…';

  try {
    const url = `/api/history?ticker=${encodeURIComponent(ticker)}&period=${hp}`;
    const r = await fetch(url);
    const data = await r.json();
    if (!r.ok || !data.dates) {
      document.querySelector('.ph-text').textContent = '無 K 線資料';
      return;
    }
    S.ohlcvData = data;
    ph.style.display = 'none';
    document.querySelector('.ph-text').textContent = '點選左側個股查看走勢';
    renderChart();
  } catch(e) {
    document.querySelector('.ph-text').textContent = '載入失敗，請重試';
    console.warn('OHLCV fetch failed', e);
  }
}

function setStatus(cls, text) {
  document.getElementById('status-dot').className = cls;
  document.getElementById('status-text').textContent = text;
}

function lockUI(lock) {
  document.getElementById('refresh-btn').disabled = lock;
  document.querySelectorAll('.tab').forEach(b => { b.disabled = lock; });
  document.querySelectorAll('.strategy-btn, .tw-strategy-btn').forEach(b => { b.disabled = lock; });
}

// ── Progress animation (lerp) ──
const _ov = { cur: 0, target: 0, timer: null };
function _tickOv() {
  const d = _ov.target - _ov.cur;
  if (Math.abs(d) < 0.2) { _ov.cur = _ov.target; clearInterval(_ov.timer); _ov.timer = null; }
  else { _ov.cur += d * 0.10; }
  document.getElementById('overlay-pct').textContent  = Math.round(_ov.cur) + '%';
  document.getElementById('overlay-fill').style.width = _ov.cur + '%';
}
function _animTo(pct) {
  _ov.target = pct;
  if (!_ov.timer) _ov.timer = setInterval(_tickOv, 16);
}

function showOverlay(text, pct) {
  const p = pct ?? 0;
  document.getElementById('overlay-text').textContent = text;
  document.getElementById('overlay').classList.add('show');
  _animTo(p);
}

function hideOverlay() {
  if (_ov.timer) { clearInterval(_ov.timer); _ov.timer = null; }
  _ov.cur = 0; _ov.target = 0;
  document.getElementById('overlay').classList.remove('show');
}

function progressPct(prog, status) {
  if (!prog) return status === 'done' ? 100 : 5;
  const m = prog.match(/(\d+)\/(\d+)/);
  if (m) {
    const ratio = parseInt(m[1]) / parseInt(m[2]);
    if (prog.includes('抓取中')) return 5 + Math.round(ratio * 68);   // 5–73%
    if (prog.includes('基本面')) return 80 + Math.round(ratio * 18);  // 80–98%
  }
  if (prog.includes('動能') || prog.includes('籌碼')) return 75;
  if (prog.includes('K 線'))  return 78;
  if (prog.includes('基本面')) return 80;
  if (status === 'scores_ready') return 79;
  if (status === 'done') return 100;
  return 5;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

async function startFetch() {
  stopLiveRefresh();
  // 靜態模式：直接讀 JSON，不打後端 API
  if (IS_STATIC) { await bootstrapStaticData(); return; }
  lockUI(true);
  showOverlay('連接中…');
  setStatus('fetching', '啟動中…');
  try {
    const r = await fetch(`/api/fetch?universe=${S.universe}`);
    if (r.status === 409) { hideOverlay(); lockUI(false); showToast('正在抓取中，請稍候'); return; }
    if (!r.ok) throw new Error('fetch failed');
    pollTimer = setInterval(pollState, 900);
  } catch(e) {
    hideOverlay(); lockUI(false);
    setStatus('error', '連線失敗');
    showToast('無法連線至伺服器');
  }
}

async function pollState() {
  try {
    const r = await fetch('/api/state');
    const s = await r.json();
    const rawLabel = s.progress || '處理中…';
    const pct      = progressPct(s.progress, s.status);

    // 把 "抓取中 300/529" 換算為 "抓取中 57/100"（讓分母對應最終結果數）
    function toDisplayLabel(prog) {
      const m = prog.match(/抓取中\s+(\d+)\/(\d+)/);
      if (m) {
        const virtual = Math.min(100, Math.round(parseInt(m[1]) / parseInt(m[2]) * 100));
        return `抓取中 ${virtual}/100`;
      }
      return prog;
    }
    const label = toDisplayLabel(rawLabel);

    if (s.status === 'fetching' || s.status === 'scores_ready') {
      setStatus('fetching', label);
      showOverlay(label, pct);

    } else if (s.status === 'done') {
      clearInterval(pollTimer); pollTimer = null;

      // 保持 overlay — 此時 OHLCV 已完成，正在渲染資料
      showOverlay('載入技術指標…', 98);
      try { await loadScores(); } catch(e) { console.warn('loadScores failed', e); }

      // 驗證 RSI 與 20日% 是否真的載入（非預設值 50 / 0）
      if (S.universe === 'tw' && S.scores.length > 0) {
        const isComplete = S.scores.some(r =>
          r.rsi    != null && Math.abs(r.rsi    - 50)   > 1   &&
          r.ret_20d != null && Math.abs(r.ret_20d)       > 0.001
        );
        if (!isComplete) {
          // 技術指標尚未就緒（OHLCV 可能仍在計算），等待後重試
          showOverlay('等待技術指標計算完成…', 99);
          await new Promise(res => setTimeout(res, 2500));
          try { await loadScores({ resetSort: false }); } catch(e) {}
        }
      }

      // 動畫跑到 100%，短暫停留後收起 overlay
      _animTo(100);
      await new Promise(res => setTimeout(res, 420));
      hideOverlay(); lockUI(false);
      setStatus('done', `更新 ${s.last_updated}`);
      document.getElementById('updated-label').textContent = `更新：${s.last_updated}`;
      startLiveRefresh();

    } else if (s.status === 'error') {
      clearInterval(pollTimer); pollTimer = null;
      hideOverlay(); lockUI(false);
      setStatus('error', '資料錯誤');
      showToast(`錯誤：${s.error}`);
    }
  } catch(_) { /* transient */ }
}

async function loadScores(opts = {}) {
  if (opts.resetSort !== false) S.sortKey = null;

  if (S.universe === 'tw' && !opts.data) {
    // 台股：預設載入 RS Score（/api/tw-rs-scores）
    S.twStrategy = S.twStrategy || 'rs';
    try {
      if (S.twStrategy === 'rs') {
        const r = await fetch('/api/tw-rs-scores');
        S.scores = (await r.json()).scores || [];
      } else {
        const r = await fetch('/api/scores');
        S.scores = (await r.json()).scores || [];
      }
    } catch(e) { S.scores = []; }
    document.getElementById('tw-breakout-view').style.display = 'none';
    document.getElementById('scores-table').style.display = '';
  } else {
    const d = opts.data ?? await (async () => {
      const r = await fetch('/api/scores');
      return await r.json();
    })();
    S.scores = d.scores || [];
  }

  applyFilter();
  // 顯示/隱藏切換按鈕
  const toggle = document.getElementById('view-toggle');
  
  updateStrategyTabs();
  if (_currentView === 'sector' && S.universe !== 'tw') {
    renderSectorView();
  } else if (_currentView === 'breakout') {
    renderBreakoutView();
  } else {
    renderHead();
    renderBody({ animate: opts.animate === true });
  }
}

function stopLiveRefresh() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = null;
}

function startLiveRefresh() {
  stopLiveRefresh();
  if (S.universe === 'tw') return;
  if (IS_STATIC) return;   // 靜態模式無後端，停用 live refresh
  liveTimer = setInterval(refreshLivePrices, 15 * 60 * 1000);   // 15 分鐘自動更新
}

async function refreshLivePrices() {
  if (liveBusy || S.universe === 'tw') return;
  liveBusy = true;
  setStatus('fetching', '即時更新中…');
  try {
    const r = await fetch(`/api/live-refresh?universe=${S.universe}`);
    if (r.status === 409) return;
    if (!r.ok) throw new Error('live refresh failed');
    const data = await r.json();
    await loadScores({ data, animate: true, resetSort: false });
    document.getElementById('updated-label').textContent = `更新：${data.last_updated}`;
    setStatus('done', `更新 ${data.last_updated}`);
    if (S.selectedTicker) {
      const row = S.scores.find(r => r.ticker === S.selectedTicker);
      if (row) document.getElementById('chart-live-price').innerHTML =
        `<span style="color:${row.day_return >= 0 ? 'var(--up)' : 'var(--down)'};font-family:var(--mono);font-size:12px;">${row.price.toFixed(2)} (${pct(row.day_return)})</span>`;
    }
  } catch(e) {
    console.warn('live refresh failed', e);
    setStatus('error', '即時更新失敗');
  } finally {
    liveBusy = false;
  }
}

async function bootstrapExistingScores() {
  updateStrategyTabs();
  // 靜態模式：自動載入預生成資料
  if (IS_STATIC) { await bootstrapStaticData(); return; }
  try {
    const r = await fetch('/api/state');
    const s = await r.json();
    if (!s.count || s.status === 'fetching') return;
    S.universe = s.universe || S.universe;
    document.querySelectorAll('.tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.u === S.universe);
    });
    await loadScores({ resetSort: true });
    setStatus(s.status === 'error' ? 'error' : 'done', s.last_updated ? `更新 ${s.last_updated}` : '已載入');
    document.getElementById('updated-label').textContent = s.last_updated ? `更新：${s.last_updated}` : '—';
    if (s.status === 'done') startLiveRefresh();
  } catch(e) {
    console.warn('bootstrap scores failed', e);
  }
}

// ══════════════════════════════════════════════════════════════
// ── 個股 / 板塊 / BREAKOUT 視角切換 ─────────────────────────────────────────
let _currentView = 'stock'; // 'stock' | 'sector' | 'breakout'

function updateStrategyTabs() {
  const isTw = S.universe === 'tw';
  const isStock = _currentView === 'stock';

  // 美股分頁一：個股視角 / 板塊視角 / 突破觀察
  const viewToggle = document.getElementById('view-toggle');
  if (viewToggle) viewToggle.style.display = !isTw ? 'flex' : 'none';

  // 美股分頁二：RS排名 / 技術面加乘 / 基本面加乘（只在個股視角顯示）
  const usStratTabs = document.getElementById('us-strategy-tabs');
  if (usStratTabs) {
    usStratTabs.style.display = (!isTw && isStock) ? 'flex' : 'none';
    // 更新美股策略 tab active 狀態
    usStratTabs.querySelectorAll('.strategy-btn').forEach(b => {
      const mode = b.dataset.strategy;
      const active = mode === 'rs'
        || (mode === 'technical'   && S.strategyLayers.technical)
        || (mode === 'fundamental' && S.strategyLayers.fundamental);
      b.classList.toggle('active', active);
      b.classList.toggle('base', mode === 'rs');
    });
  }

  // 台股分頁：RS Score / 籌碼加乘
  const twStratTabs = document.getElementById('tw-strategy-tabs');
  if (twStratTabs) {
    twStratTabs.style.display = isTw ? 'flex' : 'none';
    twStratTabs.querySelectorAll('.tw-strategy-btn').forEach(b => {

function renderSectorView() {
  // 聚合板塊資料
  const sectorMap = {};
  S.scores.forEach(r => {
    const s = r.sector || 'Other';
    if (!sectorMap[s]) sectorMap[s] = { name: s, name_zh: sectorZh(s), stocks: [], rs_sum: 0 };
    sectorMap[s].stocks.push(r);
    sectorMap[s].rs_sum += (r.rs_rating || 0);
  });
  const sectors = Object.values(sectorMap).map(s => ({
    ...s,
    sector_rs:   s.rs_sum / s.stocks.length,
    count:       s.stocks.length,
    avg_1d:      s.stocks.reduce((a,r)=>a+(r.day_return||0),0)/s.stocks.length,
    avg_20d:     s.stocks.reduce((a,r)=>a+(r.ret_20d||0),0)/s.stocks.length,
    avg_ud:      s.stocks.reduce((a,r)=>a+(r.ud_ratio_60d||1),0)/s.stocks.length,
    top3:        [...s.stocks].sort((a,b)=>(b.rs_rating||0)-(a.rs_rating||0)).slice(0,3).map(r=>r.ticker).join(' / '),
    multiplier:  s.stocks[0]?.sector_multiplier ?? 1.0,
  })).sort((a,b) => b.sector_rs - a.sector_rs);

  const allRS  = sectors.map(s => s.sector_rs);
  const q70    = allRS.slice().sort((a,b)=>b-a)[Math.floor(allRS.length*0.30)] || 70;
  const q30    = allRS.slice().sort((a,b)=>b-a)[Math.floor(allRS.length*0.70)] || 30;

  // Render header
  const thead = document.getElementById('sector-head');
  thead.innerHTML = `<tr>
    <th style="width:36px" class="center">RANK</th>
    <th style="width:140px" class="left">板塊</th>
    <th style="width:76px">SECTOR RS</th>
    <th style="width:54px">STOCKS</th>
    <th style="width:72px">AVG 當日%</th>
    <th style="width:72px">AVG 20日%</th>
    <th style="width:64px">AVG 60U/D</th>
    <th style="width:160px" class="left">TOP 3</th>
    <th style="width:76px">MULTIPLIER</th>
    <th style="width:32px"></th>
  </tr>`;

  // Render body
  const tbody = document.getElementById('sector-body');
  tbody.innerHTML = '';
  sectors.forEach((s, i) => {
    const isStrong = s.sector_rs >= q70;
    const isWeak   = s.sector_rs <= q30;
    const rsClass  = isStrong ? 'sector-strong' : (isWeak ? 'sector-weak' : '');
    const multStr  = s.multiplier >= 1.05 ? '×1.10 ▲' : (s.multiplier <= 0.95 ? '×0.90 ▼' : '×1.00');
    const multCol  = s.multiplier >= 1.05 ? 'color:var(--up)' : (s.multiplier <= 0.95 ? 'color:var(--gold)' : 'color:var(--text1)');

    const tr = document.createElement('tr');
    tr.dataset.sector = s.name;
    tr.innerHTML = `
      <td class="center" style="color:var(--text2)">${i+1}</td>
      <td class="left" style="font-weight:600">${s.name_zh} <span class="expand-btn">›</span></td>
      <td class="${rsClass}">${s.sector_rs.toFixed(1)}</td>
      <td>${s.count}</td>
      <td class="${s.avg_1d>=0?'up':'down'}">${(s.avg_1d*100).toFixed(2)}%</td>
      <td class="${s.avg_20d>=0?'up':'down'}">${(s.avg_20d*100).toFixed(2)}%</td>
      <td style="${s.avg_ud>=1.4?'color:var(--accent)':''}">${s.avg_ud.toFixed(2)}</td>
      <td class="left" style="color:var(--text1);font-size:11px">${s.top3}</td>
      <td style="${multCol};font-weight:600">${multStr}</td>
      <td></td>
    `;

    tr.addEventListener('click', () => toggleSectorDrill(tr, s));
    tbody.appendChild(tr);
  });
}

function toggleSectorDrill(tr, sector) {
  const existing = tr.nextSibling;
  if (existing && existing.classList?.contains('sector-drill-row')) {
    existing.remove();
    tr.classList.remove('expanded');
    return;
  }
  // 收合其他展開的板塊
  document.querySelectorAll('.sector-drill-row').forEach(r => r.remove());
  document.querySelectorAll('#sector-body tr.expanded').forEach(r => r.classList.remove('expanded'));
  tr.classList.add('expanded');

  // 排序板塊內個股（rs_rating 降序）
  const stocks = [...sector.stocks].sort((a,b) => (b.rs_rating||0)-(a.rs_rating||0));
  const total  = stocks.length;
  const drillTr = document.createElement('tr');
  drillTr.className = 'sector-drill-row';

  const td = document.createElement('td');
  td.colSpan = 10;
  td.style.padding = '0';
  td.style.background = 'var(--bg0)';

  inner.innerHTML = `<thead><tr style="background:var(--bg2)">
    <th style="width:60px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:center">S.RANK</th>
    <th style="width:80px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:left">TICKER</th>

    <th style="width:68px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:right">20日%</th>

    <th style="width:58px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:center">RS趨勢</th>
    <th style="width:58px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:center">RS翻強</th>
    <th style="width:62px;padding:5px 10px;font-size:10px;color:var(--text1);text-align:right">60U/D</th>

  </tr></thead><tbody>${
    stocks.map((r, idx) => {

      const isLead  = rank <= 3;
      const cls     = isLead ? 'leader' : '';
      const trendCl = r.rs_trend === '↑' ? 'color:var(--down)' : (r.rs_trend === '↓' ? 'color:var(--up)' : 'color:var(--text1)');

        <td class="${cls}" style="text-align:center;color:${isLead?'var(--gold)':'var(--text2)'}">${rank}</td>
        <td class="${cls}" style="text-align:left;color:var(--accent);font-weight:600">${r.ticker}</td>
        <td style="text-align:right">$${r.price!=null?(Number.isInteger(r.price)?r.price:r.price.toFixed(2)):'—'}</td>
        <td style="text-align:right;color:${pUp?'var(--up)':'var(--down)'}">${((r.day_return||0)*100).toFixed(2)}%</td>
        <td style="text-align:right;color:${p20Up?'var(--up)':'var(--down)'}">${((r.ret_20d||0)*100).toFixed(2)}%</td>
        <td style="text-align:right;color:var(--accent);font-weight:600">${r.rs_rating!=null?r.rs_rating.toFixed(1):'—'}</td>
        <td style="text-align:center;${trendCl};font-size:13px;font-weight:700">${r.rs_trend||'—'}</td>
        <td style="text-align:center">${r.rs_breakout?'🔥':'—'}</td>

// ── Sticky column left-offset updater ──
function updateStickyLefts() {
  const ths = [...document.querySelectorAll('#t-head th')];
  // Compute cumulative left for each sticky th
  const lefts = [];
  let acc = 0;
  ths.forEach((th, i) => {
    if (th.classList.contains('col-sticky')) {
      lefts[i] = acc;
      acc += th.offsetWidth;
    }
  });

  // Apply to th
  ths.forEach((th, i) => {
    if (th.classList.contains('col-sticky')) {
      th.style.left = lefts[i] + 'px';
    }
  });

  // Determine last sticky index for shadow
  const lastIdx = [...ths].reduce((last, th, i) =>
    th.classList.contains('col-sticky') ? i : last, -1);

  // Apply to all td rows
  document.querySelectorAll('#t-body tr').forEach(row => {
    const tds = [...row.querySelectorAll('td')];
    tds.forEach((td, i) => {
      if (td.classList.contains('col-sticky')) {
        td.style.left = (lefts[i] ?? 0) + 'px';
        td.classList.toggle('col-sticky-last', i === lastIdx);
      }
    });
  });

  // Shadow on last sticky th
  ths.forEach((th, i) => {
    th.classList.toggle('col-sticky-last', th.classList.contains('col-sticky') && i === lastIdx);
  });
}

// ── Resizable divider ──
;(function() {
  const divider    = document.getElementById('divider');
  const chartPanel = document.getElementById('chart-panel');
  const MIN_W = 260, MAX_W = 900, DEFAULT_W = 430;
  let dragging = false, startX = 0, startW = 0;

  divider.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = chartPanel.offsetWidth;
    divider.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor     = 'col-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = startX - e.clientX;
    const w = Math.min(MAX_W, Math.max(MIN_W, startW + delta));
    chartPanel.style.width = w + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor     = '';
  });

  divider.addEventListener('dblclick', () => {
    chartPanel.style.width = DEFAULT_W + 'px';
  });
})();
</script>
